[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contactimpactbench"
version = "0.1.3"
description = "Reproducible numerical verification benchmarks for reduced compliant impact models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Serhii Podliesnyi"},
  {name = "Oleksii Sheremet"},
  {name = "Roman S. Tomashevskyi"},
]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
keywords = ["contact mechanics", "oblique impact", "verification", "friction", "energy balance"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Science/Research", "Natural Language :: English", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Physics", "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://github.com/spodlesny2318-arch/ContactImpactBench"
Repository = "https://github.com/spodlesny2318-arch/ContactImpactBench"
Issues = "https://github.com/spodlesny2318-arch/ContactImpactBench/issues"
Documentation = "https://github.com/spodlesny2318-arch/ContactImpactBench/tree/main/docs"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
contactimpactbench = "contactimpactbench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"contactimpactbench.data" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc"]
